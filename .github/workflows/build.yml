name: Build Collabora Office Arch Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Native Arch Package & Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Free Disk Space on Host Runner
        run: |
          echo "==> Freeing disk space on GitHub Actions runner..."
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
          df -h

      - name: Checkout Packaging Repository
        uses: actions/checkout@v4

      - name: Run Build in Clean Arch Linux Container
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/artifacts"
          chmod -R 777 "${GITHUB_WORKSPACE}"

          docker run --rm --privileged \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            docker.io/archlinux:base-devel \
            bash /workspace/scripts/ci-build-and-test.sh

      - name: Upload Build Artifacts (.pkg.tar.zst & Logs)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collabora-office-arch-build-artifacts
          path: |
            ${{ github.workspace }}/artifacts/*
          if-no-files-found: error
